<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shivpuri SR Pending Registry - Live</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2330; --mute:#6b7585; --line:#e3e7ee; --acc:#1f5fd1; --warn:#c0392b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161d; --card:#1b212b; --ink:#e8ecf3; --mute:#98a2b3; --line:#2b3340; --acc:#6aa0ff; --warn:#ff7a6b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:1200px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:4px 0 12px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; }
  select, input[type=search], button { font:inherit; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); max-width:100%; }
  button { cursor:pointer; background:var(--acc); color:#fff; border-color:var(--acc); }
  button.ghost { background:var(--card); color:var(--ink); border-color:var(--line); }
  label { display:flex; gap:6px; align-items:center; color:var(--mute); }
  .stats { display:flex; flex-wrap:wrap; gap:10px; margin:12px 0; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 14px; min-width:140px; }
  .stat b { display:block; font-size:22px; }
  .stat span { color:var(--mute); font-size:12px; }
  .status { margin:8px 0; color:var(--mute); font-size:13px; }
  .err { background:var(--card); border:1px solid var(--warn); color:var(--warn); border-radius:10px; padding:10px 12px; margin:10px 0; display:none; }
  .err small { color:var(--mute); display:block; margin-top:6px; }
  .tablebox { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:auto; }
  table { border-collapse:collapse; width:100%; min-width:900px; }
  th, td { padding:8px 10px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { position:sticky; top:0; background:var(--card); color:var(--mute); font-size:12px; text-transform:uppercase; letter-spacing:.03em; cursor:pointer; user-select:none; }
  th.nosort { cursor:default; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  tr:last-child td { border-bottom:0; }
  .hot { color:var(--warn); font-weight:600; }
  .muted { color:var(--mute); }
  .tag { font-size:11px; color:var(--mute); border:1px solid var(--line); border-radius:6px; padding:1px 5px; margin-left:6px; }
  a.tel { color:var(--acc); text-decoration:none; }
  a.tel:hover { text-decoration:underline; }
  .printhead { display:none; }
  @page { size: A4 landscape; margin: 10mm; }
  @media print {
    :root { --bg:#fff; --card:#fff; --ink:#000; --mute:#444; --line:#bbb; --acc:#000; --warn:#b00020; }
    body { background:#fff; color:#000; font-size:11px; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .wrap { max-width:none; padding:0; }
    h1, .bar, .err, .fallback, .status, .tag { display:none !important; }
    .printhead { display:block; margin-bottom:8px; }
    .printhead h2 { margin:0 0 2px; font-size:16px; }
    .printhead div { color:#333; }
    .stats { margin:6px 0; gap:8px; }
    .stat { padding:4px 10px; min-width:0; }
    .stat b { font-size:15px; }
    .tablebox { border:0; overflow:visible; }
    table { min-width:0; }
    th, td { padding:3px 5px; white-space:normal; }
    th { position:static; }
    thead { display:table-header-group; }
    tr { page-break-inside:avoid; break-inside:avoid; }
    a.tel { color:#000; }
  }
  .fallback { margin-top:10px; display:none; }
  .fallback textarea { width:100%; height:90px; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); font:12px monospace; }
</style>
</head>

<div class="wrap">
  <h1>Shivpuri - SR Pending Registry (live)</h1>

  <div class="bar">

  <div class="fallback" id="fallback">

  <div class="tablebox">
    <table>

// website aur list ki spelling alag ho to yahan jod sakte hain: "website ka naam": "list ka naam"
const ALIAS = { "dinadayal sharma": "deen dayal sharma", "anil lakra": "anil lakara" };

let ROWS = [], META = {};
let sortKey = "pending", sortDir = -1, timer = null, syncMsg = "";

const $ = id => document.getElementById(id);
const COLS = [
  ["rank", "#", true, false],
  ["disp", "SR Name", false, true],
  ["designation", "Designation", false, true],
  ["tehsils", "Tehsil", false, true],
  ["mobile", "Mobile", false, false],

  ["received", "Total", true, true],
];

function norm(s) {
  return String(s || "").normalize("NFC").replace(/[\u200b-\u200d\ufeff]/g, "").toLowerCase()
    .replace(/[^a-z0-9\u0900-\u097f ]+/g, " ").replace(/\s+/g, " ").trim();
}
const tokens = s => norm(s).split(" ").filter(Boolean);
const tehList = s => String(s || "").split(",").map(norm).filter(Boolean);

function matchContact(row) {
  const key = norm(row.name);
  const t = tokens(ALIAS[key] || row.name);
  if (!t.length) return null;
  const rt = tehList(row.tehsils);
  let pool = CONTACTS.filter(c => rt.includes(norm(c.teh)));
  if (!pool.length) pool = CONTACTS; // tehsil ki spelling na mile to poori list me khojein
  let best = null, bestScore = 0, cands = 0;
  for (const c of pool) {
    const ct = tokens(c.name);
    const [short, long] = t.length <= ct.length ? [t, ct] : [ct, t];
    if (!short.every(x => long.includes(x))) continue;
    cands++;
    let score = short.length * 10 + (norm(c.desig) === norm(row.designation) ? 1 : 0);
    if (score > bestScore) { best = c; bestScore = score; }
  }
  if (!best) return null;
  if (pool === CONTACTS && (t.length < 2 || cands > 1)) return null; // bina tehsil match ke sirf pakka match lein
  return best;
}

function ingest(json) {
  if (!json || !Array.isArray(json.rows) || !Array.isArray(json.cols)) throw new Error("JSON ka format alag hai");
  META = { as_of: json.as_of };
  const api = json.rows.map(r => Object.fromEntries(json.cols.map((c, i) => [c, r[i]])))
    .filter(r => String(r.district).normalize("NFC") === DISTRICT.normalize("NFC"));
  if (!api.length) throw new Error("Shivpuri ka data nahi mila");

  // Rows sirf website ke data se (Excel ke 98 = SR + "SR assign nahi" wali rows).
  // PDF list ke jo naam website data me nahi hain, unki extra rows ab nahi jodi jaati.
  ROWS = api.map(r => {
    const assigned = r.status !== "unassigned" && r.name && !String(r.name).startsWith("(");
    const c = assigned ? matchContact(r) : null;
    return { ...r, disp: assigned ? (c ? c.name : r.name) : "(SR assign nahi)", mobile: c ? c.mobile : "", unassigned: !assigned };
  });

  buildTehsil();
  buildSr();
  setError(null);
  render();
}

function tehLabel(t) {
  const e = Object.values(TEH).find(x => norm(x[0]) === norm(t));
  return e ? `${e[0]} (${e[1]})` : t;
}

function buildTehsil() {
  const set = new Set();
  ROWS.forEach(r => String(r.tehsils || "").split(",").map(x => x.trim()).filter(Boolean).forEach(x => set.add(x)));
  const order = Object.values(TEH).map(x => norm(x[0]));
  const list = [...set].sort((a, b) => {
    const ia = order.indexOf(norm(a)), ib = order.indexOf(norm(b));
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b, "hi");
  });
  const cur = $("tehsil").value;
  $("tehsil").innerHTML = `<option value="">All Tehsil</option>` + list.map(t => `<option value="${esc(t)}">${esc(tehLabel(t))}</option>`).join("");
  if (list.includes(cur)) $("tehsil").value = cur;
}

function inTehsil(r, t) { return !t || tehList(r.tehsils).includes(norm(t)); }

function buildSr() {
  const t = $("tehsil").value, cur = $("sr").value;
  const names = [...new Set(ROWS.filter(r => !r.unassigned && inTehsil(r, t)).map(r => r.disp))]
    .sort((a, b) => a.localeCompare(b, "en"));
  $("sr").innerHTML = `<option value="">All SR</option>` + names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
  if (names.includes(cur)) $("sr").value = cur;
}

function sortRows(list, key, dir) {
  return list.slice().sort((a, b) => {
    const x = a[key], y = b[key];
    if (typeof x === "number" && typeof y === "number") return (x - y) * dir || String(a.disp).localeCompare(b.disp);
    return String(x ?? "").localeCompare(String(y ?? ""), "hi") * dir;
  });
}

function view() {
  const t = $("tehsil").value, s = $("sr").value, q = $("q").value.trim().toLowerCase(), hz = $("hideZero").checked;
  let list = ROWS.filter(r => inTehsil(r, t));
  if (s) list = list.filter(r => r.disp === s);
  if (hz) list = list.filter(r => r.pending > 0);
  if (q) list = list.filter(r => (r.disp + " " + r.tehsils + " " + r.designation + " " + r.mobile).toLowerCase().includes(q));
  return sortRows(list, sortKey, sortDir);
}

function mobileHtml(m) {
  if (!m) return `<span class="muted">-</span>`;
  return String(m).split(/[\/,]/).map(x => x.trim()).filter(Boolean)
    .map(x => `<a class="tel" href="tel:${x.replace(/[^\d+]/g, "")}">${esc(x)}</a>`).join(" , ");
}

function render() {
  const list = view();
  const sum = k => ROWS.reduce((s, r) => s + (r[k] || 0), 0);
  const unassigned = ROWS.filter(r => r.unassigned).reduce((s, r) => s + r.pending, 0);
  $("stats").innerHTML = [
    ["Kul pending", sum("pending")],
    ["Bina SR wali pending", unassigned],
    ["15 din se purani", sum("over15")],
    ["SR ki sankhya", ROWS.filter(r => !r.unassigned).length],
    ["Kul rows", ROWS.length],
  ].map(([l, v]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");

  $("thead").innerHTML = COLS.map(([k, label, num, sortable]) =>
    `<th class="${num ? "n" : ""} ${sortable ? "" : "nosort"}" data-k="${k}">${label}${k === sortKey ? (sortDir < 0 ? " \u25BC" : " \u25B2") : ""}</th>`).join("");

  $("tbody").innerHTML = list.map((r, i) => `<tr>
    <td class="n muted">${i + 1}</td>
    <td>${esc(r.disp)}</td>
    <td class="muted">${esc(r.designation)}</td>
    <td class="muted">${esc(r.tehsils)}</td>
    <td>${mobileHtml(r.mobile)}</td>
    <td class="n ${r.pending > 0 ? "hot" : "muted"}">${r.pending}</td>
    <td class="n">${r.sub}</td>
    <td class="n">${r.rip}</td>
    <td class="n ${r.over15 > 0 ? "hot" : "muted"}">${r.over15}</td>
    <td class="n">${r.verified}</td>
    <td class="n">${r.received}</td>
  </tr>`).join("") || `<tr><td colspan="11" class="muted">Koi row nahi mili</td></tr>`;
}

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function setError(msg, hint) {
  const e = $("err");
  if (!msg) { e.style.display = "none"; $("fallback").style.display = "none"; return; }
  e.innerHTML = msg + (hint ? "<small>" + hint + "</small>" : "");
  e.style.display = "block";
  $("fallback").style.display = "block";
}

// Google Sheet: poori Shivpuri list (filter se alag), pending ke ghatte kram me
async function pushSheet() {
  const all = sortRows(ROWS, "pending", -1);
  const payload = {
    district: "Shivpuri",
    as_of: META.as_of || "",
    fetched: new Date().toLocaleString("hi-IN"),
    header: ["#", "SR", "Pad", "Tehsil", "Mobile", "Pending", "Submitted", "In Process", "15 din+", "Completed", "Kul"],
    rows: all.map((r, i) => [i + 1, r.disp, r.designation, r.tehsils, r.mobile, r.pending, r.sub, r.rip, r.over15, r.verified, r.received]),
  };
  try {
    // no-cors: jawab padh nahi sakte, par data Sheet tak pahunch jata hai
    await fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
    syncMsg = " - Sheet sync: " + new Date().toLocaleTimeString("hi-IN");
  } catch (e) {
    syncMsg = " - Sheet sync nahi hua (" + e.message + ")";
  }
  $("status").textContent = $("status").textContent.split(" - Sheet sync")[0] + syncMsg;
}

async function load() {
  $("status").textContent = "Data la rahe hain...";
  try {
    const res = await fetch(API, { headers: { accept: "application/json" }, cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    ingest(await res.json());
    $("status").textContent = "Live data - website ki date: " + (META.as_of || "?") + " - fetch: " + new Date().toLocaleTimeString("hi-IN");
    pushSheet();
  } catch (e) {
    $("status").textContent = "";
    setError("Live fetch nahi ho paya (" + e.message + ").",
      "Sambhavit karan: website dusre page ko API call karne ki anumati (CORS) nahi deti. Neeche backup se JSON load kar sakte hain.");
  }
}

function setTimer() {
  clearInterval(timer);
  const s = +$("auto").value;
  if (s > 0) timer = setInterval(load, s * 1000);
}

function downloadCsv() {
  const list = view();
  const head = ["SR", "Designation", "Tehsil", "Mobile", "Pending", "Submitted", "In Process", "15 din+", "Completed", "Kul"];
  const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const lines = [head.map(q).join(",")].concat(list.map(r =>
    [r.disp, r.designation, r.tehsils, r.mobile, r.pending, r.sub, r.rip, r.over15, r.verified, r.received].map(q).join(",")));
  const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "shivpuri_sr_pending.csv";
  a.click();
}

// PDF: browser ka print dialog khulta hai, wahan "Save as PDF" chunein. Hindi text sahi aata hai.
function fillPrintHead() {
  const t = $("tehsil").value, s = $("sr").value, q = $("q").value.trim();
  const f = [];
  if (t) f.push("Tehsil: " + t);
  if (s) f.push("SR: " + s);
  if (q) f.push("Khoj: " + q);
  if ($("hideZero").checked) f.push("Pending 0 wale chhupaye gaye");
  $("printhead").innerHTML =
    `<h2>Shivpuri - SR Pending Registry Report</h2>` +
    `<div>Website data ki date: ${esc(META.as_of || "?")} &nbsp;|&nbsp; Report banane ka samay: ${esc(new Date().toLocaleString("hi-IN"))}</div>` +
    `<div>Filter: ${f.length ? esc(f.join(" | ")) : "Koi nahi (poori Shivpuri list)"} &nbsp;|&nbsp; Kul rows: ${view().length}</div>`;
}
window.addEventListener("beforeprint", fillPrintHead);
$("pdf").onclick = () => {
  if (!ROWS.length) { alert("Pehle data load hone dein."); return; }
  const old = document.title;
  document.title = "Shivpuri_SR_Pending_" + (META.as_of || "report"); // PDF ka default file name
  fillPrintHead();
  window.print();
  setTimeout(() => { document.title = old; }, 1000);
};

$("refresh").onclick = load;
$("csv").onclick = downloadCsv;
$("auto").onchange = setTimer;
$("tehsil").onchange = () => { buildSr(); render(); };
$("sr").onchange = $("hideZero").onchange = render;
$("q").oninput = render;
$("thead").onclick = e => {
  const k = e.target.closest("th")?.dataset.k;
  const col = COLS.find(c => c[0] === k);
  if (!col || !col[3]) return;
  if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = col[2] ? -1 : 1; }
  render();
};
$("file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { ingest(JSON.parse(await f.text())); $("status").textContent = "File se data - website ki date: " + (META.as_of || "?"); }
  catch (err) { alert("File padhne me dikkat: " + err.message); }
};
$("usePaste").onclick = () => {
  try { ingest(JSON.parse($("paste").value)); $("status").textContent = "Paste kiye data se - website ki date: " + (META.as_of || "?"); }
  catch (err) { alert("JSON sahi nahi hai: " + err.message); }
};

load();
setTimer();
</script>
</body>
</html>
