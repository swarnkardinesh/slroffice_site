<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Svamitva registry: live progress dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ee;--sf:#fff;--ink:#14201b;--mut:#5b6862;--ln:#e1e6e2;--ac:#176b57;--ac2:#0e3f4f;--acb:#e2f2ec;--lo:#fbdcd8;--lot:#8a1f15;--mi:#faebc4;--mit:#6a4606;--hi:#d3ebc3;--hit:#1f4a0b;--bar:#2b7a8c;--up:#0f7a4f;--upb:#d9f2e4;--dn:#9a5b06;--dnb:#fbecd0;--sh:0 1px 2px rgba(20,40,30,.06),0 4px 14px rgba(20,40,30,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1512;--sf:#18211d;--ink:#e8eee9;--mut:#9fb0a8;--ln:#2a3631;--ac:#4fbf9f;--ac2:#2a8fa8;--acb:#1c3a31;--lo:#4a1f1b;--lot:#f5b8b1;--mi:#4a3a14;--mit:#f3d58b;--hi:#24401a;--hit:#bfe3a8;--bar:#5db5c7;--up:#6fdc9f;--upb:#1b3b2a;--dn:#f0c27a;--dnb:#40300f;--sh:none}}
:root[data-theme="dark"]{--bg:#0f1512;--sf:#18211d;--ink:#e8eee9;--mut:#9fb0a8;--ln:#2a3631;--ac:#4fbf9f;--ac2:#2a8fa8;--acb:#1c3a31;--lo:#4a1f1b;--lot:#f5b8b1;--mi:#4a3a14;--mit:#f3d58b;--hi:#24401a;--hit:#bfe3a8;--bar:#5db5c7;--up:#6fdc9f;--upb:#1b3b2a;--dn:#f0c27a;--dnb:#40300f;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Noto Sans Devanagari","Mukta","Hind","Nirmala UI","Mangal","Kohinoor Devanagari","Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.hd{background:linear-gradient(120deg,var(--ac2),var(--ac));color:#fff;padding:20px 14px 62px}.in{max-width:1220px;margin:0 auto}.hd h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.2px}.hd p{margin:2px 0 10px;opacity:.88;font-size:13px}
.stat{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}.stat>div{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:10px;padding:5px 12px;font-size:13px}.stat small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;opacity:.85;line-height:1.2}.stat b{font-size:15px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#4ade80;margin-right:6px;animation:pl 1.8s infinite}.dot.err{background:#f87171;animation:none}.dot.ld{background:#fbbf24}@keyframes pl{0%{box-shadow:0 0 0 0 rgba(74,222,128,.7)}70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.bs button{border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:99px;padding:2px 11px;font-size:12px;margin:0 6px 4px 0;cursor:pointer;font-family:inherit}.bs button.on{background:#fff;color:var(--ac2);font-weight:700}.tp{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.tc2{background:var(--bg);border-radius:12px;padding:12px;border-top:4px solid var(--ac)}.tc2.r1{border-color:#e0a800}.tc2.r2{border-color:#9aa5b1}.tc2.r3{border-color:#c0773a}.tc2 h4{margin:0;font-size:15px}.tc2 .s2{color:var(--mut);font-size:12px}.tc2 .bg{font-size:26px;font-weight:700;color:var(--up)}.tc2 table{margin-top:6px}.tc2 td{padding:3px 4px;font-size:12px}.lgd{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;margin-top:8px}.lgd i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}.chip{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:2px 11px;font-size:12px;margin:0 6px 4px 0}
.w{max-width:1220px;margin:-46px auto 0;padding:0 14px 40px}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;background:var(--sf);border-radius:12px;padding:12px;box-shadow:var(--sh);margin-bottom:14px}
.fl label{font-size:11px;color:var(--mut);display:block;text-transform:uppercase;letter-spacing:.4px}select,input{width:100%;padding:7px 8px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.top{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-bottom:14px}@media(min-width:860px){.top{grid-template-columns:310px minmax(0,1fr)}}
.hero{background:linear-gradient(150deg,var(--ac),var(--ac2));color:#fff;border-radius:14px;padding:18px;box-shadow:var(--sh)}.hero b{display:block;font-size:50px;line-height:1.05;font-weight:700;margin:2px 0}.hero span{font-size:13px;opacity:.92;display:block}.hero .gd{margin-top:10px;background:rgba(255,255,255,.18);border-radius:8px;padding:6px 10px;font-size:13px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px}.k div{background:var(--sf);border-radius:12px;padding:10px 12px;box-shadow:var(--sh);border-top:3px solid var(--bar)}.k div.g{border-top-color:var(--up)}.k div.o{border-top-color:#d99a1c}.k div.r{border-top-color:#c8483b}.k small{color:var(--mut);font-size:12px;display:block}.k b{font-size:20px;font-weight:700}
.card{background:var(--sf);border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--sh)}.card h2{font-size:15px;margin:0 0 10px;font-weight:700}.card h2 small{color:var(--mut);font-weight:400;font-size:12px;margin-left:6px}
.g2{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}@media(min-width:960px){.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.ch{background:var(--bg);border-radius:10px;padding:8px 12px}.ch small{color:var(--mut);font-size:12px;display:block}.ch b{font-size:20px}.ch>span{font-size:12px;color:var(--mut);display:block}
.fn{display:grid;grid-template-columns:128px minmax(0,1fr) 150px;gap:7px 10px;align-items:center;font-size:13px}.tr{background:var(--ln);height:13px;border-radius:4px;position:relative}.tr i{display:block;height:13px;border-radius:4px;background:var(--bar)}.tr i.gi{background:var(--up)}.tr u{position:absolute;top:-3px;width:2px;height:19px;background:var(--ink);opacity:.7}.lg{grid-column:1/-1;color:var(--mut);font-size:12px}
.tabs,.sb{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.tabs button,.sb button{border:1px solid var(--ln);background:var(--sf);color:var(--ink);padding:8px 14px;border-radius:99px;font:inherit;cursor:pointer;box-shadow:var(--sh)}.tabs button.on,.sb button.on{background:var(--ac);color:#fff;border-color:var(--ac)}.sb button{padding:5px 12px;font-size:13px}
.tw{overflow-x:auto;border-radius:10px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px 9px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}th{position:sticky;top:0;background:var(--sf);cursor:pointer;color:var(--mut);font-weight:600;font-size:12px;z-index:1}
td.l,th.l{text-align:left}td.sr{color:var(--mut)}td.w2{white-space:normal;min-width:190px;max-width:300px}tr:hover td{background:var(--acb)}tr.tot td{font-weight:700;background:var(--acb);border-top:2px solid var(--ac)}
.pc{display:inline-block;min-width:54px;padding:1px 7px;border-radius:6px;text-align:right;font-weight:600}.lo{background:var(--lo);color:var(--lot)}.mi{background:var(--mi);color:var(--mit)}.hi{background:var(--hi);color:var(--hit)}.sc{padding:1px 8px;border-radius:99px;font-size:12px}
.d{font-size:10.5px;font-weight:700;margin-left:3px;padding:0 4px;border-radius:4px;vertical-align:super;line-height:1}.d.up{background:var(--upb);color:var(--up)}.d.g{background:var(--up);color:#fff}.d.dn{background:var(--dnb);color:var(--dn)}
.dd{display:inline-block;min-width:34px;padding:1px 7px;border-radius:6px;font-weight:700}.dd.up{background:var(--upb);color:var(--up)}.dd.g{background:var(--up);color:#fff}.dd.dn{background:var(--dnb);color:var(--dn)}.dz{color:var(--mut)}
.more{margin-top:8px;padding:7px 14px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:8px;cursor:pointer;font:inherit}.note{color:var(--mut);font-size:12px;margin-top:8px}h3{font-size:13px;margin:14px 0 6px}
.bg2{display:flex;gap:8px;margin:8px 0 4px}.bg2>div{flex:1;background:var(--sf);border-radius:8px;padding:5px 10px;border:1px solid var(--ln)}.bg2 b{font-size:22px;display:block;line-height:1.2}.bg2 .on{border-color:var(--up)}.bg2 .on b{color:var(--up)}.bg2 small{font-size:11px;color:var(--mut)}.dt td{text-align:center}.dt td.l{text-align:left}.dt td.ck{cursor:pointer;font-weight:700;color:var(--ac)}.dt td.ck:hover{background:var(--acb);text-decoration:underline}.dt td.dsel,.dt td.dsel:hover{background:var(--ac);color:#fff}.dt td.tt{font-weight:700;background:var(--acb)}.dt tr.tot td{font-weight:700}.rng{font-size:12px;opacity:.92;margin-top:4px}.ph{display:none}.pdfb{margin-left:auto;background:var(--ac)!important;color:#fff!important;border-color:var(--ac)!important;font-weight:600}
#pm{display:none;padding:8px 12px;border-radius:8px;margin-bottom:10px;background:#fff8e1;color:#5b3d05}#pm.err{background:#fde7e4;color:#8a1f15}
@media print{@page{size:A4 landscape;margin:8mm}body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:11px}.fl,.g2,.tabs,.sb,.more,.note,#bs,.stat{display:none!important}.hd{padding:8px 14px}.w{margin-top:6px}.ph{display:block;font-weight:700;font-size:13px;margin:0 0 6px}.tw{overflow:visible}table{font-size:9px}th,td{padding:3px 4px;white-space:normal}th{position:static}thead{display:table-header-group}tr{break-inside:avoid}.card,.k div{box-shadow:none;border:1px solid var(--ln)}.top{grid-template-columns:200px 1fr}.hero b{font-size:34px}.tp{grid-template-columns:repeat(3,1fr)}.tc2{break-inside:avoid}}
</style></head><body>
<div class="hd"><div class="in"><h1>Svamitva registry: live progress dashboard</h1><p>तहसील, कोर्ट, पटवारी और गाँव के अनुसार प्रगति समीक्षा · Google Sheet से स्वतः अपडेट</p>
<div class="stat"><div><small>Status</small><b><span class="dot ld" id="dot"></span><span id="stx">Loading…</span></b></div><div><small>Last Updated (Data Sync)</small><b id="lsync">—</b></div><div><small>Next check</small><b id="cdn">—</b></div></div>
<span class="chip">तुलना:</span><span id="bs"></span><span class="chip">Completion % = Completed / Total plots</span><div class="rng" id="rng"></div></div></div>
<div class="w">
<div class="fl" id="fl"></div>
<div id="pm"></div><div class="ph" id="ph"></div><div class="top"><div class="hero"><span>Completion %</span><b id="hp">—</b><span id="hs"></span><div class="gd" id="hd"></div></div><div class="k" id="k"></div></div>
<div class="card" id="pgc"><h2 id="ptt"></h2><div class="pg" id="pg"></div></div>
<div class="g2"><div class="card"><h2 id="ft"></h2><div class="fn" id="fn"></div></div><div class="card"><h2 id="tt"></h2><div class="fn" id="tc"></div></div></div>
<div class="tabs" id="tabs"></div><div class="card"><div id="sb"></div><div class="tw" id="tb"></div></div>
</div>
<script>
/* ============ CONFIG ============ */
const CFG={
  ID:"1dafxm2UDPL7idfc3AIx7M0dkuPU0PCBo73Z2DYtbNk4",
  SHEETS:["RegistryReport","Sheet2","Sheet1"], // गाँव-स्तर का डेटा जिस टैब में है उसका नाम सबसे पहले रखें
  SYNC_SHEETS:["Sheet1","RegistryReport",""],   // जहाँ "Last Sync:" लिखा है
  APPS_SCRIPT_URL:"",                           // वैकल्पिक: doGet वाला URL, JSON {values:[[...]]}
  POLL:60,
  NA:"Patwari Not Assigned"
};
/* ================================ */
let D=[],SYNC='',SD='',DT='',hash='',okSheet='',remain=CFG.POLL,busy=false;
const F={s:'',t:'',c:'',p:'',st:'',q:''};let tab='tehsil',lim=100,lv='tehsil',sort={},dsel=null,bk=1,T=[];
const NA=CFG.NA;
const BS={1:{s:'1 दिन पहले',n:1,sh:'पिछले 1 दिन'},7:{s:'1 सप्ताह पहले',n:7,sh:'पिछला 1 सप्ताह'}};let B=BS[1];
const lbl=()=>`${B.sh} की प्रगति (डेटा ${SYNC||'—'} तक)`;
const nf=x=>(+x||0).toLocaleString('en-IN'),pf=(a,b)=>b?a/b*100:0,pt=x=>x.toFixed(2)+'%',esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

/* ---------- data loading ---------- */
function parseCSV(t){const rows=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(c);c=""}else if(ch=='\n'){r.push(c);rows.push(r);r=[];c=""}else if(ch!='\r')c+=ch}if(c!==""||r.length){r.push(c);rows.push(r)}return rows}
async function getRows(sheet){
  if(CFG.APPS_SCRIPT_URL){const r=await fetch(CFG.APPS_SCRIPT_URL+(CFG.APPS_SCRIPT_URL.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'});const j=await r.json();return j.values||j}
  let u=`https://docs.google.com/spreadsheets/d/${CFG.ID}/gviz/tq?tqx=out:csv&_=${Date.now()}`;if(sheet)u+='&sheet='+encodeURIComponent(sheet);
  const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return parseCSV(await r.text())}
const norm=s=>String(s==null?'':s).toLowerCase().replace(/[^a-z0-9\u0900-\u097f]/g,'');
const num=v=>{const s=String(v==null?'':v).replace(/[,\s%+]/g,'').replace('−','-');const n=parseFloat(s);return isNaN(n)?0:n};
const FIELDS=[['l',/lgd/],['v',/verif/],['pr',/process/],['sb',/submit/],['i',/initiat/],['p1',/day/],['p7',/week/],['cm',/^completed/],['pl',/plot/],['b',/benef/],['h',/halka|हल्का|हलका/],['m',/mobile|phone|मोबाइल/],['pn',/patwari|पटवारी/],['t',/tehsil|तहसील/],['s',/subdiv|sdm|उपखंड/],['c',/court|न्यायालय/],['n',/village|gram|गाँव|गांव|ग्राम/]];
function mapHeader(row){const map={},used=new Set(),hn=row.map(norm);
  FIELDS.forEach(([f,re])=>{const j=hn.findIndex((h,x)=>h&&!used.has(x)&&re.test(h));if(j>=0){map[f]=j;used.add(j)}});return map}
function findSync(rows){for(const r of rows){const k=r.findIndex(c=>/last\s*sync/i.test(c||''));if(k>=0){const v=(r.slice(k+1).find(c=>c&&String(c).trim())||'').trim();if(v)return v}}return''}
function buildData(rows){
  const hi=rows.findIndex(r=>{const m=mapHeader(r);return m.n!=null&&m.pl!=null&&m.cm!=null});if(hi<0)return null;
  const m=mapHeader(rows[hi]),out=[];
  for(let i=hi+1;i<rows.length;i++){const r=rows[i],g=f=>m[f]!=null?String(r[m[f]]==null?'':r[m[f]]).trim():'';
    const n=g('n');if(!n||/^(total|grand\s*total|sub\s*total|कुल|कुल\s*योग|योग)$/i.test(n.trim()))continue;const pl=num(g('pl'));if(!pl&&!num(g('cm')))continue;
    const pn=g('pn')||NA,t=g('t')||'—',mob=g('m')||'-';
    D_push(out,{n,l:g('l'),t,s:g('s')||'—',c:g('c')||'—',pn,h:g('h')||'—',m:mob,pk:t+'|'+pn+'|'+mob,pl,b:num(g('b')),i:num(g('i')),v:num(g('v')),sb:num(g('sb')),pr:num(g('pr')),cm:num(g('cm')),p1:num(g('p1')),p7:num(g('p7'))})}
  return{out,m,hasP:m.p1!=null||m.p7!=null,head:rows[hi]}}
function D_push(a,r){r.di=r.dv=r.ds=r.dp=0;r.dc=r.p1;r.e=[0,0,0,0,r.p7];r.a=[0,0,0,0,r.p1];a.push(r)}
async function loadAll(){
  const list=CFG.APPS_SCRIPT_URL?['']:[...new Set([okSheet,...CFG.SHEETS].filter(Boolean))].concat(['']);
  let res=null,rowsMain=null,lastErr='';
  for(const sh of list){try{const rows=await getRows(sh);const b=buildData(rows);if(b&&b.out.length){res=b;rowsMain=rows;okSheet=sh;break}lastErr=`टैब "${sh}" में गाँव-स्तर के कॉलम (Village / Total plots / Completed) नहीं मिले`}catch(e){lastErr=e.message}}
  if(!res)throw new Error(lastErr||'डेटा नहीं मिला');
  let sync=findSync(rowsMain);
  if(!sync)for(const sh of CFG.SYNC_SHEETS){try{sync=findSync(await getRows(sh));if(sync)break}catch(e){}}
  return{res,sync}}

/* ---------- derived setup ---------- */
const stOf=r=>r.pl>0&&r.cm>=r.pl?'Fully completed':r.cm>0?'Partly completed':(r.i+r.v+r.sb+r.pr>0?'Started, not completed':'Not started');
const cs=c=>String(c).replace(/^[^\s]*\.\s*/,''),NF=['pl','b','i','v','sb','pr','cm','di','dv','ds','dp','dc','x16','x14','p1','p7'];
function setB(k){bk=k;B=BS[k];D.forEach(r=>{[r.di,r.dv,r.ds,r.dp,r.dc]=k==1?r.a:r.e;r.ns=(r.i-r.di)+(r.v-r.dv)+(r.sb-r.ds)+(r.pr-r.dp)+(r.cm-r.dc)==0&&r.i+r.v+r.sb+r.pr+r.cm>0})}
function setup(){
  D.forEach(r=>{r.st=stOf(r);r.x16=r.p1;r.x14=r.p7});
  const u=k=>[...new Set(D.map(r=>r[k]))].sort((a,b)=>String(a).localeCompare(String(b),'hi')),pmap=new Map(D.map(r=>[r.pk,r.t+' - '+r.pn]));
  const sel=[['s','Subdivision',u('s').map(x=>[x,x])],['t','Tehsil',u('t').map(x=>[x,x])],['c','Court',u('c').map(x=>[x,cs(x)])],['p','Patwari',[...pmap].sort((a,b)=>a[1].localeCompare(b[1],'hi')).map(([k,v])=>[k,v])],['st','Status',['Fully completed','Partly completed','Started, not completed','Not started'].map(x=>[x,x])]];
  sel.forEach(([k,,o])=>{if(F[k]&&!o.some(x=>x[0]==F[k]))F[k]=''});
  fl.innerHTML=sel.map(([k,l,o])=>`<div><label>${l}</label><select data-k="${k}"><option value="">All</option>${o.map(([v,t])=>`<option value="${esc(v)}"${F[k]==v?' selected':''}>${esc(t)}</option>`).join('')}</select></div>`).join('')+`<div><label>Search</label><input data-k="q" value="${esc(F.q)}" placeholder="गाँव, LGD, पटवारी या हल्का"></div>`;
  window.ZPN=(()=>{const m=new Map();D.forEach(r=>{if(r.pn==NA)return;m.set(r.pk,(m.get(r.pk)||0)+r.i+r.v+r.sb+r.pr+r.cm)});return[...m.values()].filter(v=>v==0).length})();
  T=[['tehsil','Tehsil-wise'],['court','Court-wise'],['patwari','Patwari-wise'],['halka','Halka-wise'],['village','Village-wise'],['top','🏆 TOP 10 पटवारी'],['bottom','⬇ BOTTOM 50 पटवारी'],['dist','📊 पटवारी वितरण'],['zero','⚠ शून्य प्रगति पटवारी'],['progress','Progress'],['action','Action list']].filter(x=>x[0]!='zero'||ZPN>0);
  if(!T.some(x=>x[0]==tab))tab='tehsil';
  tabs.innerHTML=T.map(([k,l])=>`<button data-t="${k}">${l}</button>`).join('')+'<button class="pdfb" id="pdfb">📄 PDF डाउनलोड</button>';
  bs.innerHTML=`<span class="bs">`+[[1,'1 Day progress'],[7,'1 Week progress']].map(([k,l])=>`<button data-b="${k}">${l}</button>`).join('')+'</span>';
  [...bs.querySelectorAll('button')].forEach(b=>b.classList.toggle('on',b.dataset.b==bk));
  setB(bk);
}

/* ---------- listeners (एक बार) ---------- */

h=`<div class="note" style="margin:0 0 10px">ऐसे पटवारी जिनके सभी गाँवों में Registry initiated, Verification, Submitted, In process और Completed, पाँचों में शून्य है, यानी अभी तक कोई काम शुरू नहीं हुआ। कुल <b>${nf(z.length)}</b> पटवारी, <b>${nf(z.reduce((a,g)=>a+g.vil,0))}</b> गाँव, <b>${nf(z.reduce((a,g)=>a+g.pl,0))}</b> प्लॉट।</div>`+tbl('zero',z,[['teh','Tehsil','t'],['k','Patwari','t'],['mob','Mobile','t'],['hal','Halka','t'],['vn','संबद्ध ग्राम','t'],['vil','Villages'],['pl','Plots'],['b','Beneficiaries'],...SC],1,{k:'pl',d:-1})}
if(tab=='action'){const a=R.filter(r=>r.st=='Not started'&&r.pl>=100),b=R.filter(r=>r.pn==NA);
h=`<h3>कार्य शुरू नहीं हुआ, 100+ प्लॉट (${nf(a.length)} गाँव)</h3>`+tbl('a1',a,vc,1)+`<h3>पटवारी नियुक्त नहीं (${nf(b.length)} गाँव)</h3>`+tbl('a2',b,vc,1)}
tb.innerHTML=h}

/* ---------- live refresh ---------- */
function setStatus(kind,txt){dot.className='dot'+(kind=='ok'?'':kind=='err'?' err':' ld');stx.textContent=txt}
async function refresh(force){
  if(busy)return;busy=true;setStatus('ld','Updating…');
  try{
    const {res,sync}=await loadAll();
    const hs=sync+'|'+res.out.length+'|'+res.out.reduce((a,r)=>a+r.cm+r.i+r.v+r.sb+r.pr+r.p1+r.p7,0);
    if(force||hs!==hash){
      hash=hs;D=res.out;D.hdr={p1:res.head[res.m.p1],p7:res.head[res.m.p7]};SYNC=sync;
      SD=(sync.split(' ')[0]||'').slice(0,10);
      setup();draw();
      if(!res.hasP)showMsg('सूचना: शीट में "1 day / 1 week progress" कॉलम नहीं मिले, इसलिए तुलना में 0 दिख रहा है। कॉलम के हेडर में "1 Day" / "1 Week" शब्द होने चाहिए।');else showMsg('');
    }
    lsync.textContent=SYNC||'—';setStatus('ok','Live · '+nf(D.length)+' गाँव · Completed '+nf(D.reduce((a,r)=>a+r.cm,0)));
  }catch(e){setStatus('err','Connection issue');showMsg('डेटा लोड नहीं हो सका: '+e.message+' · जाँचें कि Sheet "Anyone with the link – Viewer" पर शेयर है। पिछला डेटा स्क्रीन पर बना हुआ है।',true)}
  busy=false;remain=CFG.POLL}
setInterval(()=>{remain--;if(remain<=0)refresh();else cdn.textContent=remain+' sec'},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
refresh(true);
</script></body></html>
