<style>

.gb{display:flex;flex-direction:column;gap:4px}.gb .tr{height:9px;border-radius:5px}.gb .a i{background:var(--dy)}.gb .b i{background:var(--wk)}

.tabs button.on,.sbb button.on,.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}.sbb{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.sbb button{padding:5px 12px;font-size:13px}

tr.tot td{font-weight:800;background:var(--acb)!important;border-top:2px solid var(--ac);position:sticky;bottom:0}
