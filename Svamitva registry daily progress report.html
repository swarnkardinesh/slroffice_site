<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVAMITVA Registry Progress Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10283d;
    --ink-soft:#4a6073;
    --paper:#f4f7f9;
    --card:#ffffff;
    --line:#dbe4ea;
    --head:#12354f;
    --head-text:#ffffff;
    --field:#1f7a5c;
    --field-soft:#dff1ea;
    --amber:#b86e00;
    --amber-soft:#fdf0d8;
    --total:#eaf1f6;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Mukta","Noto Sans Devanagari",system-ui,sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding:20px 14px 36px;
    line-height:1.45;
  }
  .wrap{max-width:1280px;margin:0 auto}

  /* ---------- Heading ---------- */
  .masthead{
    background:var(--head);
    color:var(--head-text);
    border-radius:14px 14px 0 0;
    padding:22px 26px 20px;
    display:flex;flex-wrap:wrap;gap:12px 24px;
    align-items:flex-end;justify-content:space-between;
    border-bottom:4px solid var(--field);
  }
  .masthead h1{
    margin:0 0 4px;
    font-size:clamp(1.15rem,2.2vw,1.65rem);
    font-weight:800;letter-spacing:.1px;
  }
  .masthead p{
    margin:0;
    font-size:clamp(.92rem,1.5vw,1.08rem);
    color:#c5d8e6;font-weight:400;
  }
  .status{
    display:flex;align-items:center;gap:8px;
    font-size:.85rem;color:#c5d8e6;
    background:rgba(255,255,255,.08);
    padding:6px 12px;border-radius:999px;
    white-space:nowrap;
  }
  .dot{width:9px;height:9px;border-radius:50%;background:#6fd3a8;flex:none}
  .status.loading .dot{background:#f2c14e;animation:pulse 1s infinite}
  .status.error .dot{background:#ef6b5b}
  @keyframes pulse{50%{opacity:.3}}

  /* ---------- Table ---------- */
  .table-card{
    background:var(--card);
    border:1px solid var(--line);
    border-top:none;
    border-radius:0 0 14px 14px;
    overflow:hidden;
  }
  .scroll{overflow-x:auto}
  table{
    width:100%;
    border-collapse:separate;border-spacing:0;
    min-width:980px;
    font-size:.98rem;
  }
  thead th{
    position:sticky;top:0;
    background:#e6eef4;
    color:var(--ink);
    font-weight:800;
    text-align:right;
    padding:13px 14px;
    border-bottom:2px solid var(--head);
    font-size:.88rem;line-height:1.25;
    vertical-align:bottom;
  }
  thead th:first-child,thead th:nth-child(2){text-align:left}
  tbody td{
    padding:12px 14px;
    border-bottom:1px solid var(--line);
    text-align:right;
    font-variant-numeric:tabular-nums;
  }
  tbody td:first-child{text-align:left;color:var(--ink-soft);width:56px}
  tbody td:nth-child(2){text-align:left;font-weight:600}
  tbody tr:nth-child(even){background:#fafcfd}
  tbody tr:hover{background:#eef6f2}

  /* Completion bar */
  .pct{display:flex;align-items:center;gap:10px;justify-content:flex-end;min-width:150px}
  .bar{flex:1;height:8px;border-radius:99px;background:#e3ebf0;overflow:hidden;min-width:70px}
  .bar i{display:block;height:100%;background:var(--field);border-radius:99px;transition:width .6s ease}
  .pct b{min-width:56px;text-align:right;font-weight:800;color:var(--field)}

  /* Progress-from-morning chip */
  .chip{
    display:inline-block;min-width:48px;
    padding:2px 10px;border-radius:999px;
    background:var(--amber-soft);color:var(--amber);
    font-weight:800;text-align:center;
  }

  /* Total row */
  tbody tr.total td{
    background:var(--total);
    font-weight:800;
    border-top:2px solid var(--head);
    border-bottom:none;
    font-size:1.02rem;
  }
  tbody tr.total:hover td{background:var(--total)}
  tbody tr.total .chip{background:var(--head);color:#fff}

  /* Cell flash when data changes */
  @keyframes flash{from{background:#fff3b8}to{background:transparent}}
  td.changed{animation:flash 1.6s ease-out}

  .msg{padding:34px;text-align:center;color:var(--ink-soft)}
  .foot{margin-top:10px;font-size:.8rem;color:var(--ink-soft);text-align:right}

  @media (max-width:640px){
    body{padding:10px 6px 24px}
    .masthead{padding:16px}
    tbody td,thead th{padding:10px 9px}
  }
  @media (prefers-reduced-motion:reduce){
    .bar i{transition:none}
    td.changed,.status.loading .dot{animation:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div>
      <h1 id="title">डेटा लोड हो रहा है…</h1>
      <p id="subtitle"></p>
    </div>
    <div class="status loading" id="status" role="status" aria-live="polite">
      <span class="dot"></span><span id="statusText">लोड हो रहा है</span>
    </div>
  </header>

  <div class="table-card">
    <div class="scroll">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"><tr><td class="msg" colspan="12">Google Sheet से डेटा आ रहा है…</td></tr></tbody>
      </table>
    </div>
  </div>
  <div class="foot">डेटा Google Sheet से स्वतः अपडेट होता है</div>
</div>

<script>
/* =======================  सेटिंग  ======================= */
// Google Sheet का "Publish to web" वाला CSV लिंक (pubhtml की जगह pub?output=csv)
const CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTu1ru3JwkKgNDTg-oI0HtL_3X937_fvzmx2GnwaE3rEUMEotOMUHwNhVxFORnVGegrhBD6MUxKb7OT/pub?gid=1613441531&single=true&output=csv";

// हर कितने सेकंड में sheet दोबारा जाँचनी है
const REFRESH_SECONDS = 20;
/* ========================================================== */

const $ = id => document.getElementById(id);
let lastSnapshot = "";

/* CSV parser (quotes और commas सही तरीके से संभालता है) */
function parseCSV(text){
  const rows=[]; let row=[], cell="", inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else inQ=false; }
      else cell+=c;
    }else{
      if(c==='"') inQ=true;
      else if(c===','){ row.push(cell); cell=""; }
      else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=""; }
      else if(c!=='\r') cell+=c;
    }
  }
  if(cell!==""||row.length){ row.push(cell); rows.push(row); }
  return rows;
}

const esc = s => String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const isNum = v => /^-?\d+(\.\d+)?$/.test(String(v).trim());
const fmt = v => isNum(v) ? Number(v).toLocaleString("en-IN") : esc(v);

function setStatus(kind,text){
  const s=$("status"); s.className="status "+kind; $("statusText").textContent=text;
}

function render(rows){
  // खाली पंक्तियाँ हटाएँ
  rows = rows.filter(r=>r.some(c=>c.trim()!==""));
  if(rows.length<3) throw new Error("Sheet में पर्याप्त डेटा नहीं मिला");

  const title = rows[0].find(c=>c.trim()) || "";
  const subtitle = rows[1].find(c=>c.trim()) || "";
  const header = rows[2];
  const body = rows.slice(3);
  const cols = header.length;

  $("title").textContent = title;
  $("subtitle").textContent = subtitle;
  document.title = subtitle || title;

  // Header
  $("thead").innerHTML = "<tr>"+header.map(h=>`<th>${esc(h)}</th>`).join("")+"</tr>";

  // Completion % और "Progress" कॉलम पहचानें
  const pctIdx = header.findIndex(h=>/completion\s*%|%/i.test(h));
  const progIdx = header.findIndex(h=>/progress\s*from/i.test(h));

  const prev = lastSnapshot ? JSON.parse(lastSnapshot) : null;

  const html = body.map((r,ri)=>{
    const isTotal = /^total$/i.test((r[0]||"").trim()) || /कुल/.test(r[0]||"");
    const tds = header.map((_,ci)=>{
      const v = (r[ci]??"").trim();
      let inner;
      if(ci===pctIdx && v){
        const n = Math.max(0,Math.min(100,parseFloat(v)||0));
        inner = `<div class="pct"><span class="bar"><i style="width:${n}%"></i></span><b>${esc(v)}</b></div>`;
      }else if(ci===progIdx && v){
        inner = `<span class="chip">${fmt(v)}</span>`;
      }else{
        inner = fmt(v);
      }
      const changed = prev && prev[ri] && prev[ri][ci]!==undefined && prev[ri][ci]!==v;
      return `<td${changed?' class="changed"':''}>${inner}</td>`;
    }).join("");
    return `<tr${isTotal?' class="total"':''}>${tds}</tr>`;
  }).join("");

  $("tbody").innerHTML = html;
  lastSnapshot = JSON.stringify(body.map(r=>header.map((_,i)=>(r[i]??"").trim())));
}

async function load(){
  try{
    const res = await fetch(CSV_URL+"&_="+Date.now(), {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    render(parseCSV(await res.text()));
    const t = new Date().toLocaleTimeString("hi-IN",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
    setStatus("","लाइव · अंतिम जाँच "+t);
  }catch(e){
    console.error(e);
    setStatus("error","डेटा नहीं मिला, दोबारा कोशिश हो रही है");
    if(!lastSnapshot){
      $("tbody").innerHTML='<tr><td class="msg" colspan="12">डेटा लोड नहीं हो सका। Sheet "Publish to web" पर है या नहीं जाँचें।</td></tr>';
    }
  }
}

load();
setInterval(load, REFRESH_SECONDS*1000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) load(); });
</script>
</body>
</html>
